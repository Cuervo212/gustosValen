spring.application.name=gustosValen

# Configuración de la conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/primerabase?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Forzar a Hibernate a respetar exactamente las mayúsculas y minúsculas de tus anotaciones @Table y @Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
